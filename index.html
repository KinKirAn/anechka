<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1730">
<meta name="robots" content="noindex,nofollow">
<title>Тропа к твоему дню</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Caveat:wght@500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1b1730; --dusk:#3b2c4f; --plum:#6b3f5f; --rose:#e48a7c; --amber:#f4b860; --gold:#ffd88a;
  --cream:#fff6ea; --ink:#2a2233; --muted:#9a8fa8; --pine:#1f3a33;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--night);color:var(--cream);font-family:var(--sans);font-size:16px}
body{overscroll-behavior:none}
button{font:inherit;cursor:pointer;border:0}
.app{max-width:480px;margin:0 auto;min-height:100%;position:relative}
.screen{display:none;min-height:100vh;min-height:100dvh}
.screen.on{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border-radius:999px;
  background:linear-gradient(135deg,var(--amber),var(--rose));color:#2a1626;font-weight:700;letter-spacing:.2px;
  box-shadow:0 8px 24px -8px rgba(244,184,96,.6);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(255,246,234,.08);color:var(--cream);box-shadow:none;border:1px solid rgba(255,246,234,.18)}
.btn.small{padding:9px 16px;font-size:14px}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;line-height:1.1}

/* login */
#login{background:linear-gradient(180deg,#221c3c 0%,#4a2f55 45%,#c9706a 78%,#f2b768 100%);position:relative;overflow:hidden}
#login .ridge{position:absolute;left:0;right:0;bottom:0;width:100%}
#login .inner{position:relative;z-index:2;padding:22vh 28px 0;text-align:center}
#login h1{font-size:44px}
#login p{color:rgba(255,246,234,.8);margin:12px 0 30px;line-height:1.5}
.codebox{display:flex;flex-direction:column;gap:14px;align-items:center}
.codebox input{width:100%;max-width:300px;padding:15px 18px;border-radius:16px;border:1px solid rgba(255,246,234,.3);
  background:rgba(27,23,48,.45);color:var(--cream);font-size:18px;text-align:center;outline:none;backdrop-filter:blur(6px)}
.codebox input::placeholder{color:rgba(255,246,234,.5)}
.err{color:#ffd1c8;min-height:20px;font-size:14px}

/* home */
#home{background:var(--night)}
.top{position:sticky;top:0;z-index:20;padding:14px 18px 12px;background:linear-gradient(180deg,#1b1730 85%,rgba(27,23,48,0));}
.hello{display:flex;justify-content:space-between;align-items:center}
.hello h2{font-size:28px}
.iconbtn{width:40px;height:40px;border-radius:50%;background:rgba(255,246,234,.08);color:var(--cream);font-size:18px;display:grid;place-items:center}
.count{margin-top:10px;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted)}
.count b{font-family:var(--serif);font-size:26px;color:var(--gold);font-weight:600}
.cd{display:flex;gap:10px;margin-top:4px}
.cd div{flex:1;text-align:center;background:rgba(255,246,234,.06);border-radius:12px;padding:8px 0}
.cd b{display:block;font-family:var(--serif);font-size:26px;color:var(--gold);line-height:1}
.cd span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.prog{margin-top:10px;height:6px;border-radius:6px;background:rgba(255,246,234,.1);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--gold));border-radius:6px;transition:width .6s}
.trailwrap{position:relative;padding-bottom:96px}
#trail{display:block;width:100%}
.node{cursor:pointer}
.node text{font-family:var(--sans)}
@keyframes pulse{0%{r:20;opacity:.7}100%{r:34;opacity:0}}
.pulse{animation:pulse 1.6s ease-out infinite}
.bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;display:flex;gap:10px;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(27,23,48,.98) 60%,rgba(27,23,48,0))}
.bar .btn{flex:1}

/* admin */
.admin{margin:8px 0 0;padding:10px 12px;border-radius:12px;background:rgba(228,138,124,.14);border:1px dashed rgba(228,138,124,.5);font-size:13px}
.admin .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.admin input{background:rgba(0,0,0,.25);color:var(--cream);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:6px 8px;font:inherit}
.admin details{margin-top:6px}
.admin table{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px}
.admin td{padding:3px 4px;border-bottom:1px solid rgba(255,255,255,.08)}

/* day */
#day{background:var(--night);padding-bottom:110px}
.dayhead{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:14px 16px;background:rgba(27,23,48,.96)}
.dayhead .t{flex:1}
.dayhead small{color:var(--muted);font-size:12px;letter-spacing:1px;text-transform:uppercase}
.dayhead h3{font-size:22px}
.dots{display:flex;gap:6px;justify-content:center;padding:4px 0 10px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,246,234,.2)}
.dots i.on{background:var(--gold)}
.stage{padding:4px 18px}
.card{background:rgba(255,246,234,.05);border:1px solid rgba(255,246,234,.08);border-radius:22px;overflow:hidden}
.foghost{position:relative;border-radius:22px;overflow:hidden;touch-action:none;user-select:none;background:#2b2440}
.foghost img{display:block;width:100%;height:auto}
.foghost canvas{position:absolute;inset:0;width:100%;height:100%;transition:opacity .9s}
.hinttext{text-align:center;color:var(--muted);font-size:14px;margin:14px 6px;line-height:1.5}
.story{padding:26px 22px;min-height:52vh}
.story p{font-family:var(--serif);font-size:24px;line-height:1.35;margin:0 0 18px;opacity:0;transform:translateY(8px);transition:all .8s}
.story p.on{opacity:1;transform:none}
.tapnote{text-align:center;color:var(--muted);font-size:13px}
.q{padding:24px 20px}
.q h3{font-size:30px;text-align:center}
.q .note{text-align:center;color:var(--muted);font-size:14px;margin:8px 0 18px}
.q .thumb{border-radius:16px;overflow:hidden;margin-bottom:18px}
.q .thumb img{display:block;width:100%}
.ans{display:flex;gap:8px}
.ans input{flex:1;min-width:0;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,246,234,.25);background:rgba(0,0,0,.25);
  color:var(--cream);font-size:18px;outline:none;text-transform:none}
.ans input:focus{border-color:var(--amber)}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.msg{text-align:center;min-height:22px;margin:12px 0 0;color:#ffd1c8;font-size:15px}
.hints{margin-top:16px}
.hint{background:rgba(244,184,96,.1);border-left:3px solid var(--amber);padding:10px 12px;border-radius:8px;margin-top:8px;font-size:15px;line-height:1.4;animation:fade .5s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tiles{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.tile{width:48px;height:56px;border-radius:12px;background:var(--cream);color:var(--ink);font-family:var(--serif);font-size:30px;font-weight:600;display:grid;place-items:center;box-shadow:0 4px 0 #d9c7ad}
.tile.used{opacity:.25;pointer-events:none}
.slots{display:flex;gap:8px;justify-content:center;margin-top:14px}
.slot{width:48px;height:56px;border-radius:12px;border:2px dashed rgba(255,246,234,.3);display:grid;place-items:center;font-family:var(--serif);font-size:30px;color:var(--gold)}
.reward{padding:22px 18px;text-align:center}
.reward h3{font-size:34px;color:var(--gold);margin:6px 0 12px}
.reward p{font-family:var(--serif);font-size:22px;line-height:1.4;margin:16px 4px 0}
.reward img{width:100%;border-radius:20px;display:block;box-shadow:0 20px 50px -20px rgba(0,0,0,.7)}
.letter{display:inline-grid;place-items:center;width:90px;height:110px;border-radius:16px;background:var(--cream);color:var(--ink);font-family:var(--serif);font-size:70px;font-weight:600;margin:10px auto}
.navbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;gap:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(27,23,48,1) 65%,rgba(27,23,48,0));z-index:15}
.navbar .btn{flex:1}

/* album & modal */
#album{padding-bottom:40px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 14px}
.grid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;display:block}
.grid figure{margin:0}
.grid figcaption{font-size:12px;color:var(--muted);padding:4px 2px}
.empty{color:var(--muted);text-align:center;padding:40px 20px}
.modal{position:fixed;inset:0;z-index:100;background:rgba(10,8,20,.82);display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal.on{display:flex}
.sheet{background:linear-gradient(180deg,#2c2444,#231d38);border-radius:24px;padding:26px 22px;max-width:420px;width:100%;max-height:86vh;overflow:auto;border:1px solid rgba(255,246,234,.1)}
.sheet h2{font-size:30px;margin-bottom:10px}
.sheet p,.sheet li{line-height:1.55;color:rgba(255,246,234,.88)}
.sheet ul{padding-left:20px}
.lightbox img{max-width:100%;max-height:86vh;border-radius:14px}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,246,234,.15);border-top-color:var(--amber);animation:spin 1s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.heart{position:fixed;z-index:200;pointer-events:none;font-size:24px;animation:fly 2.4s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),-80vh) rotate(var(--r));opacity:0}}
/* story v2 */
.scene{height:150px;border-radius:22px 22px 0 0;overflow:hidden;position:relative;background:linear-gradient(180deg,#3b2c5c 0%,#b8607a 55%,#f4b860 100%);animation:dusk 30s linear forwards}
@keyframes dusk{to{filter:saturate(1.25) brightness(.85)}}
.scene .sun{position:absolute;left:50%;top:40px;width:70px;height:70px;margin-left:-35px;border-radius:50%;background:radial-gradient(circle,#fff3c4,#ffc46b 60%,rgba(255,196,107,0) 72%);animation:sunset 26s ease-in forwards}
@keyframes sunset{to{transform:translateY(70px)}}
.scene > svg{position:absolute;left:0;bottom:0;width:100%}
.scene .car{position:absolute;bottom:14px;font-size:30px;animation:drive 9s linear infinite;transform:scaleX(-1)}
@keyframes drive{from{left:-50px}to{left:110%}}
.scene .cloud{position:absolute;font-size:26px;opacity:.85;animation:drift 22s linear infinite}
@keyframes drift{from{left:-40px}to{left:110%}}
.story2{padding:22px 18px 26px;min-height:46vh}
.sline{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px;opacity:0;transform:translateY(14px);filter:blur(6px);transition:all .9s cubic-bezier(.2,.8,.2,1)}
.sline.on{opacity:1;transform:none;filter:none}
.sline .em{font-size:34px;line-height:1;flex:none;transform:scale(0) rotate(-30deg)}
.sline.on .em{animation:pop .7s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes pop{to{transform:scale(1) rotate(0)}}
.sline .tx{font-family:var(--serif);font-size:22px;line-height:1.35}
.sline.last .tx{color:var(--gold);font-size:25px}
/* scenes */
.scene.rain{background:linear-gradient(180deg,#6f7c95 0%,#a9b4c4 50%,#f1d8a6 100%);animation:clear 9s ease forwards}
@keyframes clear{to{background-position:0 0;filter:brightness(1.12) saturate(1.2)}}
.scene .rbow{position:absolute;left:0;bottom:0;width:100%;height:100%}
@keyframes drawarc{to{stroke-dashoffset:0}}
.scene .drop{position:absolute;top:-10px;width:2px;height:12px;background:rgba(255,255,255,.7);border-radius:2px;animation:fall .9s linear infinite, stoprain 1s 6s forwards}
@keyframes fall{to{transform:translateY(170px)}}
@keyframes stoprain{to{opacity:0}}
.scene.sky{background:linear-gradient(180deg,#7fb2e5 0%,#bcd8f0 60%,#f6e3c0 100%);animation:none}
.balloonfly{position:absolute;left:50%;font-size:44px;margin-left:-22px;bottom:-50px;animation:fly2 12s ease-out forwards}
@keyframes fly2{0%{bottom:-50px}60%{transform:translateX(30px)}100%{bottom:70px;transform:translateX(-10px)}}
.rbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.rb{height:56px;border-radius:14px;color:#fff;font-size:11px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;transition:all .3s}
.rb.used{opacity:.15;transform:scale(.9)}
.rb.bad{animation:shake .4s}
.pz{display:grid;gap:3px;border-radius:14px;overflow:hidden;aspect-ratio:3/4;transition:gap .6s}
.pz.done{gap:0}
.pt{cursor:pointer;transition:transform .2s, box-shadow .2s}
.pt.sel{transform:scale(.92);box-shadow:0 0 0 3px var(--gold);border-radius:6px}
.cq{font-family:var(--serif);font-size:24px;line-height:1.3;text-align:center;margin:0 0 16px}
.cnote{margin-top:14px;text-align:center;font-size:15px;line-height:1.5;color:var(--gold);min-height:20px;animation:fade .5s}
.skybox{position:relative;height:340px;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#4f86c6,#9cc4ea 60%,#f3d9a8)}
.skybox .ground{position:absolute;left:0;right:0;bottom:0;height:8%;background:#3e8f7e}
.skybox .goal{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:13px;font-weight:700;color:#fff;border-bottom:2px dashed rgba(255,255,255,.7);padding-bottom:6px;margin:0 14px}
.bal{position:absolute;left:50%;bottom:8%;font-size:56px;margin-left:-28px;transition:bottom .08s linear}
.alt{text-align:center;margin:12px 0;color:var(--muted)}.alt b{font-family:var(--serif);font-size:40px;color:var(--gold)}
.fire{width:96px;height:96px;border-radius:50%;font-size:48px;background:radial-gradient(circle,#ffcf6b,#f0743a);box-shadow:0 10px 30px -6px rgba(240,116,58,.8)}
.fire.puff{animation:puff .25s}
@keyframes puff{50%{transform:scale(.88)}}
/* ===== THEME: SKY (day 3) ===== */
#day.theme-sky{--ink2:#22314f;background:linear-gradient(180deg,#bfe0fb 0%,#e6f2fd 45%,#fff6ea 100%);color:var(--ink2);transition:background 1.2s,color 1.2s}
#day.theme-sky .dayhead{background:rgba(214,234,252,.92)}
#day.theme-sky .dayhead small{color:#6b7fa3}
#day.theme-sky .dayhead h3{font-family:'Caveat',cursive;font-size:30px;font-weight:700}
#day.theme-sky .iconbtn{background:rgba(34,49,79,.08);color:var(--ink2)}
#day.theme-sky .dots i{background:rgba(34,49,79,.15)}#day.theme-sky .dots i.on{background:#3a6fd8}
#day.theme-sky .card{background:rgba(255,255,255,.78);border:1px solid rgba(34,49,79,.06);box-shadow:0 14px 34px -18px rgba(34,80,140,.45);border-radius:26px}
#day.theme-sky h3,#day.theme-sky .game h3{font-family:'Caveat',cursive;font-weight:700;font-size:36px}
#day.theme-sky .sub,#day.theme-sky .stat,#day.theme-sky .hinttext,#day.theme-sky .tapnote,#day.theme-sky .q .note{color:#6b7fa3}
#day.theme-sky .sline .tx{font-family:'Caveat',cursive;font-size:29px;line-height:1.2}
#day.theme-sky .sline.last .tx{color:#3a6fd8;font-size:32px}
#day.theme-sky .navbar{background:linear-gradient(0deg,#fff6ea 65%,rgba(255,246,234,0))}
#day.theme-sky .btn{background:linear-gradient(135deg,#6db5f0,#3a6fd8);color:#fff;box-shadow:0 8px 24px -8px rgba(58,111,216,.6)}
#day.theme-sky .btn.ghost{background:rgba(255,255,255,.7);color:var(--ink2);border:1px solid rgba(34,49,79,.15);box-shadow:none}
#day.theme-sky .oi{color:var(--ink2);background:rgba(255,255,255,.8);border-color:rgba(34,49,79,.12)}
#day.theme-sky .oi.ok{background:#e1efff;border-color:#3a6fd8}#day.theme-sky .oi.ok .n{background:#3a6fd8;color:#fff}
#day.theme-sky .ans input,#day.theme-sky .ta{background:#fff;color:var(--ink2);border:1px solid rgba(34,49,79,.2)}
#day.theme-sky .q h3{font-size:38px}
#day.theme-sky .msg{color:#c0392b}
#day.theme-sky .hint{background:#eaf3ff;border-left-color:#3a6fd8}
#day.theme-sky .slot{border-color:rgba(34,49,79,.25);color:#3a6fd8}
#day.theme-sky .tile{box-shadow:0 4px 0 #c5d6ea;background:#fff}
#day.theme-sky .reward h3{color:#3a6fd8;font-size:44px}
#day.theme-sky .reward p{font-family:'Caveat',cursive;font-size:30px;line-height:1.2}
#day.theme-sky .cq{font-family:'Caveat',cursive;font-size:30px;line-height:1.2}
#day.theme-sky .alt{color:#6b7fa3}#day.theme-sky .alt b{color:#3a6fd8}
#day.theme-sky .spinner{border-color:rgba(34,49,79,.12);border-top-color:#3a6fd8}
/* night mood */
#day.theme-sky.night{background:radial-gradient(ellipse at 50% 0%,#24346a 0%,#0e1430 60%,#070a1a 100%);color:#e9eefc}
#day.theme-sky.night::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff,transparent),radial-gradient(1px 1px at 85% 60%,#fff,transparent),radial-gradient(1px 1px at 10% 85%,#fff,transparent),radial-gradient(1.2px 1.2px at 55% 45%,#fff,transparent);opacity:.6}
#day.theme-sky.night .dayhead{background:rgba(14,20,48,.9)}
#day.theme-sky.night .iconbtn{background:rgba(255,255,255,.1);color:#e9eefc}
#day.theme-sky.night .card{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1);box-shadow:none}
#day.theme-sky.night .navbar{background:linear-gradient(0deg,#0b1024 65%,rgba(11,16,36,0))}
#day.theme-sky.night .btn{background:linear-gradient(135deg,#ffd88a,#f4b860);color:#2a1626}
#day.theme-sky.night .btn.ghost{background:rgba(255,255,255,.08);color:#e9eefc;border-color:rgba(255,255,255,.2)}
#day.theme-sky.night .sline.last .tx{color:#ffd88a}
#day.theme-sky.night .ta{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.2)}
#day.theme-sky.night .dots i.on{background:#ffd88a}
/* sunday + night scenes */
.scene.sunday{background:linear-gradient(180deg,#8ec5f2 0%,#cfe7fb 60%,#fff2d6 100%);animation:none}
.scene .rays{position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#fff6c9 0%,rgba(255,236,160,.5) 35%,rgba(255,236,160,0) 70%);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.15)}}
.scene .bird{position:absolute;font-size:20px;animation:drift 12s linear infinite}
.scene.nightsc{background:linear-gradient(180deg,#0e1430 0%,#1d2a5a 60%,#2a3a72 100%);animation:none}
.scene .star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
.scene .moon{position:absolute;right:40px;top:18px;width:44px;height:44px;border-radius:50%;background:#fff3c4;box-shadow:0 0 30px 6px rgba(255,243,196,.45),inset -10px -4px 0 #e9d9a0}
.scene .water{position:absolute;left:0;right:0;bottom:0;height:48px;background:linear-gradient(180deg,#152048,#0b1230)}
.scene .water i{position:absolute;width:26px;height:2px;border-radius:2px;background:#ffe9a8;opacity:.6;animation:shimmer 2s ease-in-out infinite}
@keyframes shimmer{50%{opacity:.1;transform:scaleX(.5)}}
/* ticket */
.ticket{background:#fff;color:#22314f;border-radius:22px;box-shadow:0 20px 40px -20px rgba(34,80,140,.55);overflow:hidden;position:relative}
.tk-main{padding:18px 18px 16px}
.tk-top{display:flex;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:2px;color:#3a6fd8}
.tk-route{display:flex;align-items:center;justify-content:space-between;margin:16px 0}
.tk-route small,.tk-grid small{display:block;font-size:11px;color:#8a97b3;text-transform:uppercase;letter-spacing:1px}
.tk-route b{font-family:'Caveat',cursive;font-size:30px}
.tk-plane{color:#9fb3d6;font-size:14px;white-space:nowrap}
.tk-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tk-grid b{font-size:15px}
.tk-perf{height:0;border-top:3px dashed #d8e2f2;margin:0 14px;position:relative}
.tk-perf::before,.tk-perf::after{content:"";position:absolute;top:-14px;width:26px;height:26px;border-radius:50%;background:#dcecfb}
.tk-perf::before{left:-28px}.tk-perf::after{right:-28px}
.tk-stub{display:flex;gap:14px;align-items:center;padding:16px 18px;background:#f4f8fe;font-size:14px;color:#6b7fa3;transition:transform .8s cubic-bezier(.5,0,.7,.4),opacity .8s;transform-origin:0 0}
.tk-stub.torn{transform:translateY(160px) rotate(14deg);opacity:0}
.tk-hold{position:relative;width:56px;height:56px;flex:none;display:grid;place-items:center;font-size:24px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.tk-hold svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring-bg{fill:#fff;stroke:#d8e2f2;stroke-width:4}.ring{fill:none;stroke:#3a6fd8;stroke-width:4;stroke-linecap:round}
.verse{margin:22px 8px 0;text-align:center;opacity:0;transform:translateY(10px);transition:all 1s}
.verse.on{opacity:1;transform:none}
.verse p{font-family:'Caveat',cursive;font-size:30px;line-height:1.2;margin:0 0 8px}
.verse small{color:#6b7fa3;letter-spacing:1px}
/* popclouds */
.cloudfield{position:relative;height:330px;border-radius:20px;background:linear-gradient(180deg,#9ccbf3,#e3f1fd);overflow:hidden}
.pc{position:absolute;width:30%;height:22%;background:none;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.pc .cl{position:absolute;inset:0;display:grid;place-items:center;font-size:60px;transition:transform .35s,opacity .35s}
.pc .in{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:700;color:#22314f;opacity:0;transform:scale(.3);transition:all .4s .1s}
.pc.popped .cl{transform:scale(1.6);opacity:0}.pc.popped .in{opacity:1;transform:scale(1)}
.tray{display:flex;gap:8px;justify-content:center;margin-top:14px}
.tray i{width:46px;height:54px;border-radius:12px;border:2px dashed rgba(34,49,79,.25);display:grid;place-items:center;font-style:normal;font-family:'Caveat',cursive;font-size:34px;font-weight:700;color:#3a6fd8}
.tray i.on{border-style:solid;border-color:#3a6fd8;background:#fff;animation:pop .5s}
/* findspot */
.spot{position:relative;border-radius:18px;overflow:hidden;cursor:crosshair}
.spot img{display:block;width:100%}
.spot .mark{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 3px #3a6fd8,0 0 30px #fff;opacity:0;transform:scale(2);transition:all .5s}
.spot .mark.on{opacity:1;transform:scale(1)}
.spot .miss{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:2px solid rgba(255,255,255,.9);animation:ripple .7s forwards}
@keyframes ripple{to{transform:scale(1.8);opacity:0}}
/* checklist */
.chk{display:flex;flex-direction:column;gap:8px}
.ck{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.85);border:1px solid rgba(34,49,79,.1);color:#22314f;font-size:16px;text-align:left}
.ck .box{width:24px;height:24px;border-radius:7px;border:2px solid #9fb3d6;flex:none;display:grid;place-items:center;transition:all .25s}
.ck.on .box{background:#3a6fd8;border-color:#3a6fd8}
.ck.on .box::after{content:"✓";color:#fff;font-weight:700;font-size:15px}
.ck.on span:last-child{text-decoration:line-through;text-decoration-color:rgba(58,111,216,.5);opacity:.75}
.game{position:relative}
.stamp{position:absolute;right:16px;bottom:16px;border:3px solid #d9393e;color:#d9393e;font-weight:800;letter-spacing:2px;padding:6px 10px;border-radius:8px;text-align:center;font-size:13px;line-height:1.2;transform:rotate(-14deg) scale(2.5);opacity:0;transition:all .35s cubic-bezier(.3,1.6,.5,1);background:rgba(255,255,255,.85)}
.stamp.on{opacity:1;transform:rotate(-14deg) scale(1)}
/* polaroid / develop */
.polaroid{background:#fffdf8;padding:12px 12px 0;border-radius:4px;box-shadow:0 18px 40px -16px rgba(0,0,0,.55);color:#22314f}
.polaroid img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#222}
.pcap{font-family:'Caveat',cursive;font-size:26px;line-height:1.15;text-align:center;padding:12px 6px 16px;min-height:58px;opacity:0;transition:opacity 1s}
.pcap.on{opacity:1}
.dev{width:84%;margin:6px auto 0;transform:rotate(-2deg);cursor:pointer}
.dev img{transition:filter .4s}
.dev.shk{animation:shk .3s}
@keyframes shk{25%{transform:rotate(-5deg) translateX(-6px)}75%{transform:rotate(2deg) translateX(6px)}}
.devbar{width:60%;height:5px;border-radius:5px;margin:16px auto 0;background:rgba(34,49,79,.12);overflow:hidden}
.devbar i{display:block;height:100%;width:0;background:#3a6fd8;transition:width .3s}
.pstack{position:relative;height:440px;margin-top:8px;cursor:pointer}
.pst{position:absolute;left:50%;top:0;width:72%;margin-left:-36%;transform:rotate(var(--r));transition:transform .6s cubic-bezier(.4,0,.2,1),opacity .6s}
.pst.flyR{transform:translateX(130%) rotate(25deg);opacity:0}
.pst.flyL{transform:translateX(-130%) rotate(-25deg);opacity:0}
.pst.fan{transform:translateX(var(--fx)) rotate(var(--fr)) scale(.78);opacity:1}
.ta{width:100%;border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;resize:vertical;outline:none}
.envfly{position:fixed;left:50%;top:60%;font-size:44px;z-index:200;pointer-events:none;animation:env 1.2s ease-in forwards}
@keyframes env{to{transform:translate(120px,-70vh) rotate(25deg) scale(.6);opacity:0}}
/* constellation */
.starcard{background:rgba(10,14,36,.6)!important}
.stars{width:100%;display:block}
.stars .tw{animation:tw 2.6s ease-in-out infinite}
.st{cursor:pointer}
.st .sdot{transition:all .3s;filter:drop-shadow(0 0 4px #fff)}
.st.nx .sdot{animation:nx 1s ease-in-out infinite;fill:#ffd88a}
@keyframes nx{50%{r:9}}
.st.lit .sdot{fill:#ffd88a;filter:drop-shadow(0 0 8px #ffd88a)}
.st.bad .sdot{fill:#e48a7c}
.letterlines p{font-family:'Caveat',cursive;font-size:28px;line-height:1.2;margin:0 0 10px;text-align:center;opacity:0;transform:translateY(8px);transition:all 1s}
.letterlines p.on{opacity:1;transform:none}
.letterlines p:first-child{font-size:34px;color:#ffd88a}

/* games */
.game{padding:22px 16px}
.game h3{font-size:28px;text-align:center}
.game .sub{color:var(--muted);text-align:center;font-size:14px;line-height:1.5;margin:8px 0 18px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;perspective:800px}
.mc{aspect-ratio:3/4;position:relative;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.mc.flip,.mc.ok{transform:rotateY(180deg)}
.mc div{position:absolute;inset:0;border-radius:12px;display:grid;place-items:center;backface-visibility:hidden}
.mc .b{background:linear-gradient(135deg,#5a3f72,#3a2a50);border:1px solid rgba(255,216,138,.3);font-size:20px;color:rgba(255,216,138,.6)}
.mc .f{background:var(--cream);transform:rotateY(180deg);font-size:34px}
.mc.ok .f{background:#ffe7b0;box-shadow:0 0 0 2px var(--gold)}
.stat{text-align:center;color:var(--muted);font-size:13px;margin-top:12px}
.ord{display:flex;flex-direction:column;gap:8px}
.oi{padding:13px 14px;border-radius:14px;background:rgba(255,246,234,.07);border:1px solid rgba(255,246,234,.12);text-align:left;color:var(--cream);font-size:16px;display:flex;align-items:center;gap:10px;transition:all .3s}
.oi .n{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;background:rgba(255,246,234,.1)}
.oi.ok{background:rgba(255,216,138,.18);border-color:var(--gold)}
.oi.ok .n{background:var(--gold);color:#2a1626}
.oi.bad{animation:shake .4s;border-color:#e48a7c}
/* slides */
.slides{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:3/4;background:#000}
.slides .sl{position:absolute;inset:0;opacity:0;transition:opacity 1s}
.slides .sl.on{opacity:1}
.slides .sl img{width:100%;height:100%;object-fit:cover}
.slides .sl.on img{animation:kb 7s ease-out forwards}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
.slides .cap{position:absolute;left:0;right:0;bottom:0;padding:60px 18px 20px;background:linear-gradient(0deg,rgba(15,10,25,.85),transparent);font-family:var(--serif);font-size:22px;line-height:1.3}
.slides .sl.on .cap{animation:fade 1.2s .4s both}
.sdots{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:4px}
.sdots i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.sdots i b{display:block;height:100%;width:0;background:#fff}
.sdots i.done b{width:100%}
.sdots i.cur b{animation:bar 6s linear forwards}
@keyframes bar{to{width:100%}}
.letterbox{padding:30px 22px;background:linear-gradient(180deg,#fff6ea,#f6e3c8);color:var(--ink);border-radius:22px;position:relative;overflow:hidden}
.letterbox p{font-family:var(--serif);font-size:22px;line-height:1.4;margin:0 0 14px;opacity:0;transform:translateY(10px);transition:all 1s}
.letterbox p.on{opacity:1;transform:none}
.letterbox p:first-child{font-size:28px;font-weight:600}
.letterbox .fh{position:absolute;font-size:18px;opacity:.35;animation:rise 7s linear infinite}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-500px)}}
.soon{padding:60px 26px;text-align:center}
.soon h3{font-size:30px;margin-bottom:12px}
.soon p{color:var(--muted);line-height:1.5}
</style>
</head>

<div class="app">

<script>
const API = 'https://thwymykjcgrwetcohfrc.supabase.co/functions/v1/api';
const ANON = 'sb_publishable_D506jRjcHkyNZ3nbK03WAQ_RTYT7OpW';
const BIRTHDAY = new Date('2026-12-10T19:00:00Z'); // 11 дек 00:00 Ташкент
const CHAPTERS = { memories:'Глава 1 · Воспоминания', detective:'Глава 2 · Детектив', mountains:'Глава 3 · Сюрприз' };
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

let S = { code: localStorage.getItem('code') || '', data: null, simDate: sessionStorage.getItem('simDate') || '' };
const $ = id => document.getElementById(id);
const fmtDate = d => { const [y,m,dd] = d.split('-'); return `${+dd} ${MONTHS[+m-1]}`; };

function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on', s.id===id)); window.scrollTo(0,0); }

async function api(action, extra={}){
  const r = await fetch(API, { method:'POST', headers:{'content-type':'application/json', apikey: ANON},
    body: JSON.stringify({ code: S.code, action, simDate: S.simDate || undefined, ...extra }) });
  const j = await r.json().catch(()=>({error:'net'}));
  if (r.status === 401) throw new Error('code');
  return j;
}

// ---- encrypted media ----
const mediaCache = {};
function hex2buf(h){ const a=new Uint8Array(h.length/2); for(let i=0;i<a.length;i++) a[i]=parseInt(h.substr(i*2,2),16); return a; }
async function media(ref){
  if (!ref) return '';
  if (!ref.startsWith('enc:')) return ref;
  if (mediaCache[ref]) return mediaCache[ref];
  const [path, key, mime] = ref.slice(4).split('#');
  mediaCache[ref] = (async ()=>{
    const buf = new Uint8Array(await (await fetch(path)).arrayBuffer());
    const k = await crypto.subtle.importKey('raw', hex2buf(key), 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv: buf.slice(0,12)}, k, buf.slice(12));
    return URL.createObjectURL(new Blob([plain], {type: mime || 'image/jpeg'}));
  })();
  return mediaCache[ref];
}
async function imgEl(ref, cls){ const i=new Image(); if(cls) i.className=cls; i.alt=''; i.src = await media(ref); await i.decode().catch(()=>{}); return i; }

// ---- login ----
async function login(){
  $('loginErr').textContent = '';
  S.code = $('code').value.trim();
  if (!S.code) return;
  $('enter').disabled = true;
  try { await load(); localStorage.setItem('code', S.code);
    if (S.data.role==='anna' && !localStorage.getItem('seenHelp')) { help(); localStorage.setItem('seenHelp','1'); }
  } catch(e){ $('loginErr').textContent = e.message==='code' ? 'Такого кода нет. Попробуй ещё раз 💛' : 'Нет связи, попробуй ещё раз'; show('login'); }
  $('enter').disabled = false;
}
$('enter').onclick = login;
$('code').onkeydown = e => { if(e.key==='Enter') login(); };

async function load(){
  S.data = await api('state');
  if (S.data.error) throw new Error(S.data.error);
  renderHome(); show('home');
}

// ---- home ----
function renderHome(){
  const d = S.data, admin = d.role==='admin';
  $('helloName').textContent = admin ? 'Режим автора' : 'Анечка, привет 💛';
  const done = d.days.filter(x=>x.status==='done').length;
  $('progBar').style.width = (done/d.days.length*100)+'%';
  renderAdmin();
  drawTrail();
}

function renderAdmin(){
  const p = $('adminPanel'), d = S.data;
  if (d.role!=='admin'){ p.innerHTML=''; return; }
  const ap = (d.anna?.progress||[]).map(x=>`<tr><td>День ${x.day_no}</td><td>${x.answer||''}</td><td>${new Date(x.completed_at).toLocaleString('ru-RU',{timeZone:'Asia/Tashkent'})}</td></tr>`).join('') || '<tr><td>Пока ничего не пройдено</td></tr>';
  const lg = (d.anna?.log||[]).map(x=>`<tr><td>День ${x.day_no}</td><td>${x.correct?'✅':'❌'} ${x.answer||''}</td><td>${new Date(x.at).toLocaleString('ru-RU',{timeZone:'Asia/Tashkent'})}</td></tr>`).join('') || '<tr><td>Пусто</td></tr>';
  const notReady = d.days.filter(x=>!x.authored).map(x=>x.day_no);
  p.innerHTML = `<div class="admin"><b>👀 Режим автора.</b> Твои ответы не влияют на прогресс Анечки.
    <div class="row">Смотреть как в дату: <input type="date" id="sim" value="${S.simDate||d.today}" min="2026-11-17" max="2026-12-11">
      <button class="btn small ghost" id="simReset">Сегодня</button><button class="btn small ghost" id="resetTest">Сбросить мой тест</button></div>
    <div class="row">Не заполнены: ${notReady.length? 'дни '+notReady.join(', ') : 'всё готово ✅'}</div>
    <details><summary>Прогресс Анечки</summary><table>${ap}</table></details>
    <details><summary>Её попытки ответов</summary><table>${lg}</table></details>
    <details open><summary>💌 Её письма тебе</summary><table>${(d.anna?.notes||[]).map(x=>`<tr><td>День ${x.day_no}</td><td><b>${x.q}</b><br>${x.answer.replace(/</g,'&lt;')}</td></tr>`).join('') || '<tr><td>Пока нет</td></tr>'}</table></details></div>`;
  $('sim').onchange = e => { S.simDate = e.target.value; sessionStorage.setItem('simDate', S.simDate); load(); };
  $('simReset').onclick = () => { S.simDate=''; sessionStorage.removeItem('simDate'); load(); };
  $('resetTest').onclick = async () => { await api('reset_test'); load(); };
}

function drawTrail(){
  const days = S.data.days, n = days.length, W = 400, step = 96, top = 150, H = top + n*step + 90;
  const pts = days.map((d,i)=>{ const y = H - 90 - i*step; const x = W/2 + Math.sin(i*1.05)*120; return {x,y,d}; });
  let path = `M ${pts[0].x} ${pts[0].y+80}`;
  pts.forEach((p,i)=>{ const prev = i? pts[i-1] : {x:pts[0].x,y:pts[0].y+80}; const my=(prev.y+p.y)/2; path += ` C ${prev.x} ${my}, ${p.x} ${my}, ${p.x} ${p.y}`; });
  const doneIdx = days.map(d=>d.status).lastIndexOf('done');
  const cur = days.findIndex(d=>d.status==='open');
  let s = `<defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b768"/><stop offset=".08" stop-color="#d77d6e"/><stop offset=".2" stop-color="#5a3758"/>
      <stop offset=".55" stop-color="#2a2140"/><stop offset="1" stop-color="#1b1730"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffd88a"/><stop offset="1" stop-color="#ffd88a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="${W}" height="${H}" fill="url(#sky)"/>
  <circle cx="${W/2}" cy="70" r="120" fill="url(#glow)" opacity=".35"/>
  <path d="M0 210 L80 120 L140 170 L200 60 L260 160 L320 110 L400 190 L400 ${H} L0 ${H}Z" fill="#3a2a48" opacity=".9"/>
  <path d="M200 60 L178 96 L192 90 L200 102 L210 88 L222 96Z" fill="#fff6ea" opacity=".85"/>
  <path d="M0 300 L60 250 L130 290 L210 220 L290 280 L360 240 L400 270 L400 ${H} L0 ${H}Z" fill="#2b2240" opacity=".9"/>`;
  // trees
  for(let i=0;i<40;i++){ const x=(i*97)%W, y= 330 + (i*211)%(H-400); const h=14+ (i%4)*5; s+=`<path d="M${x} ${y} l${h/2.6} ${h} h${-h/1.3}z" fill="#1f3a33" opacity="${.25+(i%3)*.12}"/>`; }
  s += `<path d="${path}" fill="none" stroke="rgba(255,246,234,.18)" stroke-width="10" stroke-linecap="round"/>
        <path d="${path}" fill="none" stroke="rgba(255,246,234,.55)" stroke-width="2" stroke-dasharray="2 9" stroke-linecap="round"/>`;
  // chapter labels
  let lastCh = null;
  pts.forEach((p,i)=>{ if(p.d.chapter!==lastCh){ lastCh=p.d.chapter; s+=`<text x="${W/2}" y="${p.y+52}" text-anchor="middle" font-family="Cormorant Garamond" font-size="17" fill="rgba(255,216,138,.75)" font-style="italic">${CHAPTERS[p.d.chapter]}</text>`; }});
  pts.forEach((p,i)=>{
    const st = p.d.status, isCur = i===cur;
    const fill = st==='done' ? '#ffd88a' : isCur ? '#f4b860' : (st==='soon'||st==='waiting') ? '#6b5a7e' : '#3d3352';
    const stroke = st==='done' ? '#fff6ea' : isCur ? '#fff6ea' : 'rgba(255,246,234,.25)';
    const lbl = st==='done' ? '✓' : (p.d.day_no===25 ? '🎂' : p.d.day_no);
    const side = p.x > W/2 ? -1 : 1;
    s += `<g class="node" data-i="${i}">
      ${isCur? `<circle cx="${p.x}" cy="${p.y}" r="20" fill="#f4b860" class="pulse"/>`:''}
      <circle cx="${p.x}" cy="${p.y}" r="22" fill="${fill}" stroke="${stroke}" stroke-width="2"/>
      <text x="${p.x}" y="${p.y+6}" text-anchor="middle" font-size="${st==='done'?20:16}" font-weight="700" fill="${st==='done'||isCur?'#2a1626':'#cbbfd8'}">${lbl}</text>
      <text x="${p.x + side*34}" y="${p.y+5}" text-anchor="${side>0?'start':'end'}" font-size="12" fill="rgba(255,246,234,.6)">${fmtDate(p.d.date)}${S.data.role==='admin'&&!p.d.authored?' · не заполнен':''}</text>
    </g>`;
  });
  const me = pts[Math.max(doneIdx,0)];
  if (doneIdx>=0) s += `<text x="${me.x}" y="${me.y-30}" text-anchor="middle" font-size="22">👣</text>`;
  const svg = $('trail'); svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.innerHTML = s;
  svg.querySelectorAll('.node').forEach(g=> g.onclick = () => openDay(days[+g.dataset.i]));
  const focus = pts[cur>=0?cur:Math.max(doneIdx,0)];
  requestAnimationFrame(()=>{ const r = svg.getBoundingClientRect(); const scale = r.width/W; window.scrollTo({top: focus.y*scale - innerHeight*0.55, behavior:'instant'}); });
}

// ---- countdown ----
function tick(){
  let ms = BIRTHDAY - Date.now(); if (ms<0) ms=0;
  const d=Math.floor(ms/864e5), h=Math.floor(ms/36e5)%24, m=Math.floor(ms/6e4)%60, s=Math.floor(ms/1e3)%60;
  $('cdD').textContent=d; $('cdH').textContent=h; $('cdM').textContent=String(m).padStart(2,'0'); $('cdS').textContent=String(s).padStart(2,'0');
}
setInterval(tick,1000); tick();

// ---- day ----
let D = null;
function openDay(day){
  if (day.status==='locked'){ openModal(`<h2>Ещё рано 🌙</h2><p>Этот день откроется ${fmtDate(day.date)}.</p><div style="text-align:center;margin-top:16px"><button class="btn" onclick="closeModal()">Хорошо</button></div>`); return; }
  if (day.status==='waiting'){ openModal(`<h2>Сначала предыдущий шаг</h2><p>Этот день уже наступил, но сначала пройди предыдущее задание 💛</p><div style="text-align:center;margin-top:16px"><button class="btn" onclick="closeModal()">Хорошо</button></div>`); return; }
  $('dayLabel').textContent = `День ${day.day_no} · ${fmtDate(day.date)}`;
  if (day.status==='soon'){ $('dayTitle').textContent = 'Скоро…'; $('dots').innerHTML=''; $('navbar').innerHTML = `<button class="btn ghost" onclick="backHome()">На тропу</button>`;
    $('stage').innerHTML = `<div class="soon"><h3>Задание готовится ✨</h3><p>Загляни чуть позже — оно появится сегодня.</p></div>`; show('day'); return; }
  $('dayTitle').textContent = day.title || '';

function buildSteps(){ D.steps = [...(D.day.steps||[]), {kind:'reward'}, ...((D.solved && D.reward?.after) || [])]; }

function nav(html){ $('navbar').innerHTML = html; }
function next(){ D.i++; renderStep(); window.scrollTo({top:0,behavior:'smooth'}); }
function prev(){ if(D.i>0){ D.i--; renderStep(); } }
window.next = next; window.prev = prev; window.backHome = backHome; window.closeModal = closeModal;

async function renderStep(){
  dots();
  const st = D.steps[D.i], stage = $('stage');
  $('day').classList.toggle('night', st.mood==='night');

  const back = D.i>0 ? `<button class="btn ghost" onclick="prev()">Назад</button>` : `<button class="btn ghost" onclick="load()">На тропу</button>`;
  if (st.kind==='fog') return fogStep(st, back);
  if (st.kind==='story') return storyStep(st, back);
  if (st.kind==='question') return questionStep(st, back);
  if (st.kind==='photo') { stage.innerHTML=''; const c=document.createElement('div'); c.className='card'; c.appendChild(await imgEl(st.photo)); stage.appendChild(c);
    if(st.text) stage.insertAdjacentHTML('beforeend',`<p class="hinttext">${st.text}</p>`); nav(back+`<button class="btn" onclick="next()">Дальше</button>`); return; }
  if (st.kind==='reward') return rewardStep(back);

async function fogStep(st, back){
  const stage = $('stage');
  const img = await imgEl(st.photo);
  stage.innerHTML = '';
  const host = document.createElement('div'); host.className='foghost'; host.appendChild(img);
  const cv = document.createElement('canvas'); host.appendChild(cv); stage.appendChild(host);
  stage.insertAdjacentHTML('beforeend', `<p class="hinttext" id="fogHint">${st.text||'Проведи пальцем, чтобы разогнать облака'}</p>`);
  nav(back + `<button class="btn" id="fogNext" style="opacity:.4" disabled>Дальше</button>`);
  const r = host.getBoundingClientRect(), dpr = Math.min(devicePixelRatio||1, 2);
  cv.width = r.width*dpr; cv.height = r.height*dpr;
  const c = cv.getContext('2d'); c.scale(dpr,dpr);
  // clouds
  const g = c.createLinearGradient(0,0,0,r.height); g.addColorStop(0,'#cfc6d9'); g.addColorStop(1,'#9a8fae');
  c.fillStyle=g; c.fillRect(0,0,r.width,r.height);
  for(let i=0;i<70;i++){ const x=Math.random()*r.width, y=Math.random()*r.height, rad=30+Math.random()*60;
    const rg=c.createRadialGradient(x,y,0,x,y,rad); rg.addColorStop(0,'rgba(255,255,255,.55)'); rg.addColorStop(1,'rgba(255,255,255,0)'); c.fillStyle=rg; c.beginPath(); c.arc(x,y,rad,0,7); c.fill(); }
  c.fillStyle='rgba(60,45,80,.55)'; c.font='600 22px Cormorant Garamond'; c.textAlign='center'; c.fillText('☁  проведи пальцем  ☁', r.width/2, r.height/2);
  c.globalCompositeOperation='destination-out';
  let drawing=false, last=null, finished=false, moves=0;
  const pos = e => { const b=cv.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-b.left, y:t.clientY-b.top}; };
  const brush = (p) => { const rg=c.createRadialGradient(p.x,p.y,0,p.x,p.y,42); rg.addColorStop(0,'rgba(0,0,0,1)'); rg.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=rg; c.beginPath(); c.arc(p.x,p.y,42,0,7); c.fill(); };
  const move = e => { if(!drawing||finished) return; e.preventDefault(); const p=pos(e);
    if(last){ const dx=p.x-last.x, dy=p.y-last.y, dist=Math.hypot(dx,dy); for(let k=0;k<dist;k+=10) brush({x:last.x+dx*k/dist,y:last.y+dy*k/dist}); }
    brush(p); last=p; if(++moves%15===0) check(); };
  const check = () => { const data=c.getImageData(0,0,cv.width,cv.height).data; let clear=0, tot=0;
    for(let i=3;i<data.length;i+=4*40){ tot++; if(data[i]<40) clear++; }
    if (clear/tot > .45) finish(); };
  const finish = () => { if(finished) return; finished=true; cv.style.opacity=0; setTimeout(()=>cv.remove(),900);
    $('fogHint').textContent='✨'; const b=$('fogNext'); b.disabled=false; b.style.opacity=1; };
  host.addEventListener('pointerdown', e=>{drawing=true; last=null; move(e);});
  host.addEventListener('pointermove', move);
  window.addEventListener('pointerup', ()=>{ if(drawing && !finished) check(); drawing=false; last=null;});
  host.addEventListener('touchmove', e=>e.preventDefault(), {passive:false});
  $('fogNext').onclick = next;
  if (D.replay) { /* replay: allow skip */ setTimeout(()=>{ const b=$('fogNext'); if(b){b.disabled=false;b.style.opacity=1;} }, 1500); }
}

function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function enableNext(id){ const b=$(id); if(b){ b.disabled=false; b.style.opacity=1; } }

function memoryStep(st, back){
  const cards = shuffle([...st.emojis, ...st.emojis]);
  $('stage').innerHTML = `<div class="card game"><h3>${st.title||'Найди пары'}</h3><div class="sub">${st.text||''}</div>
    <div class="mem">${cards.map((e,i)=>`<div class="mc" data-i="${i}"><div class="b">✦</div><div class="f">${e}</div></div>`).join('')}</div>
    <div class="stat" id="memStat">Ходов: 0</div></div>`;
  nav(back + `<button class="btn" id="gNext" style="opacity:.4" disabled>Дальше</button>`);
  if (D.replay) enableNext('gNext');
  let open=[], moves=0, found=0, busy=false;
  document.querySelectorAll('.mc').forEach(c => c.onclick = () => {
    if (busy || c.classList.contains('flip') || c.classList.contains('ok')) return;
    c.classList.add('flip'); open.push(c);
    if (open.length===2){ moves++; $('memStat').textContent = 'Ходов: '+moves; busy=true;
      const [a,b] = open;
      if (cards[a.dataset.i]===cards[b.dataset.i]) { setTimeout(()=>{ a.classList.add('ok'); b.classList.add('ok'); open=[]; busy=false; found++;
          if (found===st.emojis.length){ $('memStat').textContent = `Все пары найдены за ${moves} ходов! 🎉`; hearts(); enableNext('gNext'); } }, 350); }
      else setTimeout(()=>{ a.classList.remove('flip'); b.classList.remove('flip'); open=[]; busy=false; }, 900);
    }
  });
  $('gNext').onclick = next;
}

async function slidesStep(st, back){

  stage.insertAdjacentHTML('beforeend', `<div class="slides" id="slides"><div class="sdots">${st.items.map(()=>'<i><b></b></i>').join('')}</div>
    ${st.items.map((it,i)=>`<div class="sl"><img src="${imgs[i]}" alt=""><div class="cap">${it.cap||''}</div></div>`).join('')}</div>

  nav(back + `<button class="btn" id="gNext" style="opacity:.4" disabled>Дальше</button>`);
  const sl=[...stage.querySelectorAll('.sl')], dt=[...stage.querySelectorAll('.sdots i')]; let cur=-1, timer;
  const go = n => { if(n<0) n=0; if(n>=sl.length){ enableNext('gNext'); n=sl.length-1; }
    cur=n; sl.forEach((s,i)=>s.classList.toggle('on',i===n)); dt.forEach((d,i)=>{ d.className = i<n?'done':i===n?'cur':''; });
    if (n===sl.length-1) setTimeout(()=>enableNext('gNext'), 2500);
    clearTimeout(timer); timer=setTimeout(()=>{ if(document.getElementById('slides') && cur<sl.length-1) go(cur+1); }, 6000); };
  $('slides').onclick = e => { const r=e.currentTarget.getBoundingClientRect(); go(cur + (e.clientX-r.left > r.width/3 ? 1 : -1)); };
  go(0);
  $('gNext').onclick = () => { clearTimeout(timer); next(); };
}

function rainbowStep(st, back){
  const mix = shuffle(RB.map((c,i)=>i));

  $('stage').innerHTML = `<div class="card game"><h3>${st.title||'Собери радугу'}</h3><div class="sub">${st.text||''}</div>
    <svg viewBox="0 0 340 180" style="width:100%;display:block">${arcs}<text x="170" y="165" text-anchor="middle" font-size="28">☁️</text></svg>
    <div class="rbtns">${mix.map(i=>`<button class="rb" data-i="${i}" style="background:${RB[i][1]}"><span>${RB[i][0]}</span></button>`).join('')}</div>

    wrong++;
    const box = stage.querySelector('.ans'); box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
    const msgs = ['Не совсем… попробуй ещё 💛','Почти! Подумай ещё чуть-чуть','Возьми подсказку — она поможет 💡'];
    $('qmsg').textContent = msgs[Math.min(wrong-1, msgs.length-1)];
    if (wrong >= 2) showTiles();
  };
  $('ansBtn').onclick = check;
  $('ansIn').onkeydown = e => { if(e.key==='Enter') check(); };
}

async function rewardStep(back){
  const stage = $('stage'), r = D.reward;
  if (!D.solved || !r) { stage.innerHTML = `<div class="soon"><p>Сначала ответь на вопрос 💛</p></div>`; nav(back); return; }
  stage.innerHTML = `<div class="reward"><div style="font-size:40px">💛</div><h3>${r.title||'Ступенька пройдена!'}</h3><div id="rwImg"></div>${r.letter?`<div class="letter">${r.letter}</div>`:''}<p>${r.text||''}</p></div>`;
  if (r.photo) $('rwImg').appendChild(await imgEl(r.photo));
  const more = D.i < D.steps.length-1;
  nav(more ? back + `<button class="btn" onclick="next()">Дальше</button>` : finalNav());
}
function finalNav(){ return `<button class="btn ghost" onclick="D.i=0;renderStep()">Ещё раз</button><button class="btn" onclick="load()">На тропу</button>`; }
window.renderStep = renderStep;

function hearts(){
  for(let i=0;i<26;i++){ const h=document.createElement('div'); h.className='heart'; h.textContent=['💛','❤️','✨','🧡'][i%4];
    h.style.left = (10+Math.random()*80)+'vw'; h.style.top='85vh'; h.style.setProperty('--dx',(Math.random()*120-60)+'px'); h.style.setProperty('--r',(Math.random()*90-45)+'deg');
    h.style.animationDelay = (Math.random()*.6)+'s'; document.body.appendChild(h); setTimeout(()=>h.remove(),3200); }
}

// ---- album ----
$('btnAlbum').onclick = async () => {
  show('album'); const grid = $('grid'); grid.innerHTML = '<div class="spinner"></div>';
  const items = [], seen = new Set();
  const walk = (o, d) => { if (Array.isArray(o)) o.forEach(x=>walk(x,d)); else if (o && typeof o==='object') for (const [k,v] of Object.entries(o)) {
      if (k==='photo' && typeof v==='string') { const key=v.split('#')[0]; if(!seen.has(key)){ seen.add(key); items.push({ref:v, cap:`День ${d.day_no} · ${fmtDate(d.date)}`}); } } else walk(v,d); } };
  S.data.days.filter(d=>d.status==='done').forEach(d=>{ walk(d.steps,d); walk(d.reward,d); });
  if (!items.length) { grid.innerHTML = '<div class="empty" style="grid-column:1/-1">Здесь будут собираться фото с пройденных дней 📷</div>'; return; }
  grid.innerHTML = '';
  for (const it of items) { const f=document.createElement('figure'); const im = await imgEl(it.ref); im.onclick=()=>{ $('lbImg').src=im.src; $('lightbox').classList.add('on'); };
    f.appendChild(im); f.insertAdjacentHTML('beforeend',`<figcaption>${it.cap}</figcaption>`); grid.appendChild(f); }
};
$('albumBack').onclick = () => { show('home'); drawTrail(); };
$('lightbox').onclick = () => $('lightbox').classList.remove('on');

// ---- start ----
(async()=>{
  if (S.code) { try { await load(); return; } catch(e){ localStorage.removeItem('code'); } }
  show('login');
})();
</script>
