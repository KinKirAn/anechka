  stage.querySelector('.spinner').remove();
  stage.insertAdjacentHTML('beforeend', `<div class="slides" id="slides"><div class="sdots">${st.items.map(()=>'<i><b></b></i>').join('')}</div>
    ${st.items.map((it,i)=>`<div class="sl"><img src="${imgs[i]}" alt=""><div class="cap">${it.cap||''}</div></div>`).join('')}</div>
    <p class="hinttext">нажми справа — дальше, слева — назад</p>`);
  nav(back + `<button class="btn" id="gNext" style="opacity:.4" disabled>Дальше</button>`);
  const sl=[...stage.querySelectorAll('.sl')], dt=[...stage.querySelectorAll('.sdots i')]; let cur=-1, timer;
  const go = n => { if(n<0) n=0; if(n>=sl.length){ enableNext('gNext'); n=sl.length-1; }
    cur=n; sl.forEach((s,i)=>s.classList.toggle('on',i===n)); dt.forEach((d,i)=>{ d.className = i<n?'done':i===n?'cur':''; });
    if (n===sl.length-1) setTimeout(()=>enableNext('gNext'), 2500);
    clearTimeout(timer); timer=setTimeout(()=>{ if(document.getElementById('slides') && cur<sl.length-1) go(cur+1); }, 6000); };
  $('slides').onclick = e => { const r=e.currentTarget.getBoundingClientRect(); go(cur + (e.clientX-r.left > r.width/3 ? 1 : -1)); };
  go(0);
  $('gNext').onclick = () => { clearTimeout(timer); next(); };
}

async function puzzleStep(st, back){

  $('stage').innerHTML = `<div class="card game"><h3>${st.title||'Собери фото'}</h3><div class="sub">${st.text||''}</div>
    <div class="pz" id="pz" style="grid-template-columns:repeat(${n},1fr)"></div><div class="stat" id="pzStat">Ходов: 0</div></div>`;
  nav(back + `<button class="btn" id="gNext" style="opacity:.4" disabled>Дальше</button>`);
  if (D.replay && st.skip!==false) setTimeout(()=>enableNext('gNext'), 100);
  const pz = $('pz'); let sel=null, moves=0;
  const draw = () => { pz.innerHTML = order.map((t,pos)=>{ const x=t%n, y=Math.floor(t/n);
      return `<div class="pt${sel===pos?' sel':''}" data-p="${pos}" style="background-image:url(${url});background-size:${n*100}% ${n*100}%;background-position:${x*100/(n-1)}% ${y*100/(n-1)}%"></div>`; }).join('');
    pz.querySelectorAll('.pt').forEach(el => el.onclick = () => { const p=+el.dataset.p;
      if (sel===null){ sel=p; draw(); return; }
      if (sel!==p){ [order[sel],order[p]]=[order[p],order[sel]]; moves++; $('pzStat').textContent='Ходов: '+moves; }
      sel=null; draw();
      if (order.every((v,i)=>v===i)){ pz.classList.add('done'); $('pzStat').textContent = `Собрано за ${moves} ходов! 🎉`; hearts(); enableNext('gNext'); pz.querySelectorAll('.pt').forEach(x=>x.onclick=null); }

function drawStep(st, back){
  $('stage').innerHTML = `<div class="card game"><h3>${st.title||''}</h3><div class="sub">${st.text||''}</div>
    <div class="drawbox"><canvas id="cv"></canvas></div><div class="stat" id="dStat">Готово: 0%</div>
    <div style="text-align:center;margin-top:8px"><button class="btn small ghost" id="dClear">Стереть</button></div></div>`;
  nav(back + `<button class="btn" id="gNext" style="opacity:.4" disabled>Дальше</button>`);
  if (D.replay) enableNext('gNext');
  const cv=$('cv'), box=cv.parentElement, dpr=Math.min(devicePixelRatio||1,2), W=box.clientWidth, H=W*0.9;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+'px'; const c=cv.getContext('2d'); c.scale(dpr,dpr);
  const heart = t => { const x=16*Math.pow(Math.sin(t),3), y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t); return [W/2 + x*W/40, H/2 - y*W/40 - 10]; };
  const N=70, guide=[...Array(N)].map((_,i)=>heart(i/N*2*Math.PI)), hit=new Array(N).fill(false);
  let done=false, last=null, drawing=false;
  const paintGuide = () => { c.clearRect(0,0,W,H); c.setLineDash([4,8]); c.strokeStyle='rgba(43,43,43,.35)'; c.lineWidth=2; c.beginPath(); guide.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p)); c.closePath(); c.stroke(); c.setLineDash([]); hit.fill(false); $('dStat').textContent='Готово: 0%'; };
  paintGuide();
  const pos = e => { const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  const mark = p => { guide.forEach((g,i)=>{ if(!hit[i] && Math.hypot(g[0]-p[0],g[1]-p[1])<20) hit[i]=true; }); const pct=Math.round(hit.filter(Boolean).length/N*100); $('dStat').textContent='Готово: '+pct+'%';
    if (pct>=85 && !done){ done=true; c.fillStyle='rgba(200,55,45,0)'; let a=0; const f=setInterval(()=>{ a+=.05; c.save(); c.globalAlpha=.03; c.fillStyle='#c8372d'; c.beginPath(); guide.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p)); c.closePath(); c.fill(); c.restore(); if(a>=.6) clearInterval(f); },40);
      $('dStat').textContent='Прекрасно! Ты прирождённый художник ❤️'; hearts(); enableNext('gNext'); } };
  cv.addEventListener('pointerdown', e=>{ drawing=true; last=pos(e); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e=>{ if(!drawing) return; const p=pos(e); c.strokeStyle='#2b2b2b'; c.globalAlpha=.85; c.lineWidth=3; c.lineCap='round';
    c.beginPath(); c.moveTo(...last); c.lineTo(...p); c.stroke(); c.globalAlpha=.25; c.lineWidth=1; c.beginPath(); c.moveTo(last[0]+1.5,last[1]+1); c.lineTo(p[0]+1.5,p[1]+1); c.stroke(); c.globalAlpha=1; last=p; mark(p); });
  cv.addEventListener('pointerup', ()=>drawing=false);
  cv.addEventListener('touchmove', e=>e.preventDefault(), {passive:false});
  $('dClear').onclick = () => { if(!done) paintGuide(); };
  $('gNext').onclick = next;
}

async function rewardStep(back){
  const stage = $('stage'), r = D.reward;
  if (!D.solved || !r) { stage.innerHTML = `<div class="soon"><p>Сначала ответь на вопрос 💛</p></div>`; nav(back); return; }
  stage.innerHTML = `<div class="reward"><div style="font-size:40px">💛</div><h3>${r.title||'Ступенька пройдена!'}</h3><div id="rwImg"></div>${r.letter?`<div class="letter">${r.letter}</div>`:''}<p>${r.text||''}</p></div>`;
  if (r.photo) $('rwImg').appendChild(await imgEl(r.photo));
  const more = D.i < D.steps.length-1;
  nav(more ? back + `<button class="btn" onclick="next()">Дальше</button>` : finalNav());
}
function finalNav(){ return `<button class="btn ghost" onclick="D.i=0;renderStep()">Ещё раз</button><button class="btn" onclick="load()">На тропу</button>`; }
window.renderStep = renderStep;

function hearts(){
  for(let i=0;i<26;i++){ const h=document.createElement('div'); h.className='heart'; h.textContent=['💛','❤️','✨','🧡'][i%4];
    h.style.left = (10+Math.random()*80)+'vw'; h.style.top='85vh'; h.style.setProperty('--dx',(Math.random()*120-60)+'px'); h.style.setProperty('--r',(Math.random()*90-45)+'deg');
    h.style.animationDelay = (Math.random()*.6)+'s'; document.body.appendChild(h); setTimeout(()=>h.remove(),3200); }
}

// ---- album ----
$('btnAlbum').onclick = async () => {
  show('album'); const grid = $('grid'); grid.innerHTML = '<div class="spinner"></div>';
  const items = [], seen = new Set();
  const walk = (o, d) => { if (Array.isArray(o)) o.forEach(x=>walk(x,d)); else if (o && typeof o==='object') for (const [k,v] of Object.entries(o)) {
      if (k==='photo' && typeof v==='string') { const key=v.split('#')[0]; if(!seen.has(key)){ seen.add(key); items.push({ref:v, cap:`День ${d.day_no} · ${fmtDate(d.date)}`}); } } else walk(v,d); } };
  S.data.days.filter(d=>d.status==='done').forEach(d=>{ walk(d.steps,d); walk(d.reward,d); });
  if (!items.length) { grid.innerHTML = '<div class="empty" style="grid-column:1/-1">Здесь будут собираться фото с пройденных дней 📷</div>'; return; }
  grid.innerHTML = '';
  for (const it of items) { const f=document.createElement('figure'); const im = await imgEl(it.ref); im.onclick=()=>{ $('lbImg').src=im.src; $('lightbox').classList.add('on'); };
    f.appendChild(im); f.insertAdjacentHTML('beforeend',`<figcaption>${it.cap}</figcaption>`); grid.appendChild(f); }
};
$('albumBack').onclick = () => { show('home'); drawTrail(); };
$('lightbox').onclick = () => $('lightbox').classList.remove('on');

// ---- start ----
(async()=>{
  if (S.code) { try { await load(); return; } catch(e){ localStorage.removeItem('code'); } }
  show('login');
})();
</script>
